name: Build macOS App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AI Screenshot.app
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show System Info & Swift Version
        run: |
          sw_vers
          swift --version

      - name: Build Native App Bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Verify App Bundle & Code Signature
        run: |
          codesign -vvv --deep --strict "AI Screenshot.app"
          ls -la "AI Screenshot.app/Contents/MacOS"
          ls -la "AI Screenshot.app/Contents/Resources"

      - name: Create Zip Archive
        run: |
          ditto -c -k --keepParent "AI Screenshot.app" "AI-Screenshot.zip"
          shasum -a 256 "AI-Screenshot.zip" > "AI-Screenshot.zip.sha256"
          cat "AI-Screenshot.zip.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Screenshot-macOS
          path: |
            AI-Screenshot.zip
            AI-Screenshot.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AI-Screenshot.zip
            AI-Screenshot.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
